# Runs Kafka and all 4 Node.js services in parallel, each in its own container.
#   docker compose up --build
services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092" # so you can also run the Node services on your laptop (npm run dev)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two addresses: kafka:19092 for other containers, localhost:9092 for your laptop
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null
      interval: 5s
      retries: 20

  # Runs once, creates the topics, then exits
  create-topics:
    build: .
    command: node src/scripts/create-topics.js
    environment: { KAFKA_BROKERS: kafka:19092 }
    depends_on:
      kafka: { condition: service_healthy }

  order-api:
    build: .
    command: node src/services/order/index.js
    ports:
      - "3000:3000"
    environment: { KAFKA_BROKERS: kafka:19092 }
    depends_on:
      create-topics: { condition: service_completed_successfully }

  inventory:
    build: .
    command: node src/services/inventory/index.js
    environment: { KAFKA_BROKERS: kafka:19092 }
    depends_on:
      create-topics: { condition: service_completed_successfully }

  payment:
    build: .
    command: node src/services/payment/index.js
    environment: { KAFKA_BROKERS: kafka:19092 }
    depends_on:
      create-topics: { condition: service_completed_successfully }

  notification:
    build: .
    command: node src/services/notification/index.js
    environment: { KAFKA_BROKERS: kafka:19092 }
    depends_on:
      create-topics: { condition: service_completed_successfully }
